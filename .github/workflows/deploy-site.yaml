name: deploy-site

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  setup-build-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Socket Firewall
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        firewall-version: "1.15.0"
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
        corepack enable && corepack prepare

    - name: Install Dependencies
      run: sfw pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Build Website
      run: pnpm website:build

    - name: Publish to Cloudflare Pages
      uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler-action otherwise runs `pnpm add wrangler@4` and takes the
        # newest 4.x that passes the 7-day cooldown. 4.123.0 (v3.0.3 deploy)
        # failed Pages project lookup with API 10000 on this Account API Token;
        # 4.120.1 was the last version that succeeded on this account
        # (qified v0.13.1, 2026-08-17).
        wranglerVersion: "4.120.1"
        packageManager: pnpm
        command: pages deploy site/dist --project-name=hookified --branch=main
