minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade

overrides:
  # miniflare pins undici 7.29.1 exactly, so that request cannot reach a patched release on its own.
  "undici@>=7.0.0 <7.30.1": "8.12.2"
  # docula pulls zod 4.4.3 through @ai-sdk/* peers. GHSA-mrhx-c7xc-m3w5 is fixed in 4.6.6.
  "zod@<4.6.7": "4.6.7"

# These releases are inside the 7-day minimumReleaseAge window.
# 8.12.3 (2026-10-19) is not excluded, so undici 8 stays on 8.12.2.
# @jaredwray/fumanchu@4.7.5 (2026-10-26) is excluded so markdown-it can resolve to >=15.0.3.
# Needs Jared's sign-off.
minimumReleaseAgeExclude:
  - docula@3.0.2
  - undici@7.30.1
  - undici@8.12.2
  - '@jaredwray/fumanchu@4.7.5'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
