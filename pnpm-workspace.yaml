minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade

overrides:
  "brace-expansion@>=1.0.0 <2.0.0": ">=1.1.20 <2.0.0"
  "brace-expansion@>=5.0.0 <6.0.0": ">=5.0.11 <6.0.0"
  # miniflare pins undici 7.29.x exactly, so that range cannot reach 7.30.1.
  "undici@>=7.0.0 <7.30.1": ">=7.30.1 <8.0.0"

# These releases are inside the 7-day minimumReleaseAge window.
# 8.12.3 (2026-10-19) is not excluded, so undici 8 stays on 8.12.2.
minimumReleaseAgeExclude:
  - docula@3.0.2
  - undici@7.30.1
  - undici@8.12.2

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
